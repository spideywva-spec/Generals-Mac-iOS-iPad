name: iOS rebuild and crash diagnostics

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Xcode build configuration"
        required: true
        type: choice
        options:
          - Release
          - Debug
        default: Release
  push:
    branches:
      - clean/ios-rebuild
    paths:
      - ".github/workflows/ios-rebuild-diagnostics.yml"

permissions:
  contents: read

concurrency:
  group: ios-rebuild-diagnostics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-ios:
    name: Build iOS app and package IPA
    runs-on: macos-15
    timeout-minutes: 360
    env:
      BUILD_CONFIGURATION: ${{ inputs.configuration || 'Release' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode and report toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          cmake --version

      - name: Install build tools
        run: |
          brew install cmake ninja meson pkgconf xcodegen || true
          command -v cmake
          command -v ninja
          command -v xcodegen

      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"

      - name: Fetch graphics dependencies and fonts
        run: |
          ./scripts/build/ios/fetch-moltenvk.sh
          ./scripts/build/ios/stage-fonts.sh

      - name: Configure iOS build
        run: cmake --preset ios-vulkan

      - name: Compile game engine
        run: cmake --build build/ios-vulkan --target z_generals --parallel 3

      - name: Generate Xcode project
        run: xcodegen generate --spec ios/project.yml
        working-directory: ios

      - name: Build unsigned iOS app
        run: |
          xcodebuild -project GeneralsXZH.xcodeproj \
            -scheme GeneralsXZH \
            -configuration "$BUILD_CONFIGURATION" \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/build/ios-shell" \
            CODE_SIGNING_ALLOWED=NO build

      - name: Assemble unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="$GITHUB_WORKSPACE/build/ios-shell/Build/Products/${BUILD_CONFIGURATION}-iphoneos/GeneralsXZH.app"
          ENGINE="$GITHUB_WORKSPACE/build/ios-vulkan/GeneralsMD/GeneralsXZH.app/GeneralsXZH"
          test -d "$APP"
          test -f "$ENGINE"
          cp "$ENGINE" "$APP/GeneralsXZH"
          mkdir -p "$APP/Frameworks"
          DXVK="$GITHUB_WORKSPACE/build/ios-vulkan/_deps/dxvk-build-macos"
          for lib in \
            "$DXVK/src/d3d8/libdxvk_d3d8.0.dylib" \
            "$DXVK/src/d3d9/libdxvk_d3d9.0.dylib" \
            "$GITHUB_WORKSPACE/build/ios-vulkan/_deps/sdl3-build/libSDL3.0.dylib" \
            "$GITHUB_WORKSPACE/build/ios-vulkan/_deps/sdl3_image-build/libSDL3_image.0.dylib" \
            "$GITHUB_WORKSPACE/build/ios-vulkan/_deps/openal_soft-build/libopenal.1.24.2.dylib"; do
            test -f "$lib"
            cp "$lib" "$APP/Frameworks/"
          done
          if [[ -f "$APP/Frameworks/libopenal.1.24.2.dylib" ]]; then
            mv "$APP/Frameworks/libopenal.1.24.2.dylib" "$APP/Frameworks/libopenal.1.dylib"
          fi
          MVK=$(find "$HOME" "$GITHUB_WORKSPACE" -path '*/MoltenVK.framework/MoltenVK' -type f -print -quit 2>/dev/null || true)
          if [[ -z "$MVK" ]]; then
            echo "MoltenVK binary not found" >&2
            exit 1
          fi
          MVK_DIR="$(dirname "$MVK")"
          mkdir -p "$APP/Frameworks/MoltenVK.framework"
          cp -R "$MVK_DIR/"* "$APP/Frameworks/MoltenVK.framework/"
          /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable GeneralsXZH" "$APP/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier org.generalsxzh.unsigned" "$APP/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleSupportedPlatforms:0 iPhoneOS" "$APP/Info.plist" || true
          install_name_tool -add_rpath "@executable_path/Frameworks" "$APP/GeneralsXZH" 2>/dev/null || true
          mkdir -p "$GITHUB_WORKSPACE/build/ipa/Payload"
          cp -R "$APP" "$GITHUB_WORKSPACE/build/ipa/Payload/"
          cd "$GITHUB_WORKSPACE/build/ipa"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/GeneralsXZH-unsigned.ipa" Payload
          file "$GITHUB_WORKSPACE/GeneralsXZH-unsigned.ipa"

      - name: Upload IPA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GeneralsXZH-unsigned-ipa
          path: GeneralsXZH-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-diagnostics
          path: |
            build/**/*.log
            build/CMakeCache.txt
          if-no-files-found: ignore
          retention-days: 7
