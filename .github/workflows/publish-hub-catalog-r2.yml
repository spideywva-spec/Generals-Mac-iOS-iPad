name: Hub | Publish Catalog to R2

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/generals-hub-online
      - a13-ios-build
    paths:
      - 'ios/hub/HubCatalog.json'
      - 'launcher_web/**'
      - '.github/workflows/publish-hub-catalog-r2.yml'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate catalog
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('ios/hub/HubCatalog.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data.get('schemaVersion', 0) >= 2
          assert isinstance(data.get('mods'), list)
          print('catalogVersion=', data.get('catalogVersion'))
          PY

      - name: Detect R2 configuration
        id: r2
        run: |
          if [[ -n "$CLOUDFLARE_ACCOUNT_ID" && -n "$AWS_ACCESS_KEY_ID" && -n "$AWS_SECRET_ACCESS_KEY" && -n "$R2_BUCKET" ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
            echo 'R2 publishing is configured.'
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'R2 secrets are not configured yet; catalog validation passed, upload skipped.'
          fi

      - name: Install AWS CLI
        if: steps.r2.outputs.enabled == 'true'
        run: python3 -m pip install --disable-pip-version-check awscli

      - name: Install AWS CLI
        if: steps.r2.outputs.enabled == 'true'
        run: python3 -m pip install --disable-pip-version-check awscli

      - name: Publish web launcher to R2
        if: steps.r2.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          for channel in stable beta; do
            DEST="s3://${R2_BUCKET}/launcher/${channel}"
            aws s3 sync launcher_web "${DEST}" \
              --endpoint-url "https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com" \
              --region auto \
              --delete \
              --exclude '*.html' --exclude '*.js' --exclude '*.css' --exclude 'README.md' \
              --cache-control 'public,max-age=86400' \
              --no-progress
            for name in index.html app.js styles.css; do
              aws s3 cp "launcher_web/${name}" "${DEST}/${name}" \
                --endpoint-url "https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com" \
                --region auto \
                --cache-control 'no-cache, no-store, must-revalidate' \
                --no-progress
            done
          done

      - name: Upload catalog
        if: steps.r2.outputs.enabled == 'true'
        run: |
          aws s3 cp ios/hub/HubCatalog.json "s3://${R2_BUCKET}/catalog.json" \
            --endpoint-url "https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --region auto \
            --content-type 'application/json; charset=utf-8' \
            --cache-control 'no-cache, max-age=60' \
            --no-progress
