name: Build browser Zero Hour (experimental)
on:
  workflow_dispatch:
  push:
    branches: [web-port-wasm]
    paths:
      - '.github/workflows/build-web-wasm.yml'
      - 'web-port/**'
permissions:
  contents: read
jobs:
  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout web port upstream
        uses: actions/checkout@v4
        with:
          repository: Lolendor/Generals-WebAssembly
          path: engine
          persist-credentials: false
      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '4.0.15'
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake python3-brotli
      - name: Configure browser engine
        working-directory: engine
        run: |
          export EMSCRIPTEN_ROOT="$(dirname "$(command -v emcc)")"
          echo "EMSCRIPTEN_ROOT=$EMSCRIPTEN_ROOT"
          emcmake cmake --preset emscripten
      - name: Build browser engine
        working-directory: engine
        run: cmake --build build/emscripten --target GeneralsXZH.js --parallel 2
      - name: Stage browser shell (without copyrighted game data)
        working-directory: engine
        run: |
          mkdir -p web/dist/assets
          printf '[]\n' > web/dist/assets/builds.json
          mkdir -p web/dist/assets web/dist/i18n
          cp web/shell/*.js web/shell/index.html web/shell/brotli_bg.wasm web/dist/
          cp -R web/shell/i18n/. web/dist/i18n/
          cp web/shell/ice.json web/dist/
          cp build/emscripten/GeneralsMD/GeneralsXZH.js build/emscripten/GeneralsMD/GeneralsXZH.wasm web/dist/
          printf '[]\n' > web/dist/assets/builds.json
          sha256sum web/dist/GeneralsXZH.wasm | cut -c1-12 | awk '{printf "{\"buildId\":\"%s\"}\n",$1}' > web/dist/build.json --skip-assets
      - name: Upload web distribution
        uses: actions/upload-artifact@v4
        with:
          name: generals-x-browser-experimental
          path: engine/web/dist/
          if-no-files-found: error
