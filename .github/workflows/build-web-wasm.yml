name: Build browser Zero Hour (experimental)
on:
  workflow_dispatch:
  push:
    branches: [web-port-wasm]
    paths:
      - '.github/workflows/build-web-wasm.yml'
      - 'web-port/**'
permissions:
  contents: write
jobs:
  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout web port upstream
        uses: actions/checkout@v4
        with:
          repository: Lolendor/Generals-WebAssembly
          path: engine
          persist-credentials: false
      - name: Checkout Generals X launcher
        uses: actions/checkout@v4
        with:
          path: launcher-source
          persist-credentials: false
      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '4.0.15'
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake python3-brotli
      - name: Configure browser engine
        working-directory: engine
        run: |
          export EMSCRIPTEN_ROOT="$(dirname "$(command -v emcc)")"
          echo "EMSCRIPTEN_ROOT=$EMSCRIPTEN_ROOT"
          emcmake cmake --preset emscripten
      - name: Build browser engine
        working-directory: engine
        run: cmake --build build/emscripten --target GeneralsXZH.js --parallel 2
      - name: Stage browser shell (without copyrighted game data)
        working-directory: engine
        run: |
          mkdir -p web/dist/assets
          printf '[]\n' > web/dist/assets/builds.json
          bash scripts/web/make-dist.sh --skip-assets
      - name: Integrate original Generals X launcher and game route
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site-dist/game
          cp -R launcher-source/launcher_web/. site-dist/
          cp -R engine/web/dist/. site-dist/game/
          python3 - <<'PY'
          from pathlib import Path
          p = Path('site-dist/app.js')
          text = p.read_text()
          old = 'showToast("Демо: запрос запуска для " + activeCard.dataset.title);'
          assert text.count(old) == 1, 'Browser launcher Play hook not found'
          text = text.replace(old, 'window.location.assign("./game/");')
          p.write_text(text)
          PY
          test -f site-dist/index.html
          # A newly claimed service worker does not retroactively isolate the page.
          # Reload on controllerchange so COOP/COEP are applied to the next navigation.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('site-dist/game/coi-serviceworker.js')
          source = p.read_text()
          marker = '    navigator.serviceWorker.register(swUrl)'
          assert source.count(marker) == 1, 'COI service worker registration not found'
          source = source.replace(marker, '''    let gxReloadingForIsolation = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!window.crossOriginIsolated && !gxReloadingForIsolation) {
        gxReloadingForIsolation = true;
        window.location.reload();
      }
    });

''' + marker)
          p.write_text(source)
          PY
          test -f site-dist/game/index.html
          test -f site-dist/game/GeneralsXZH.wasm
      - name: Upload web distribution
        uses: actions/upload-artifact@v4
        with:
          name: generals-x-browser-experimental
          path: site-dist/
          if-no-files-found: error
      - name: Checkout published web branch
        uses: actions/checkout@v4
        with:
          ref: web-wasm-dist
          path: published
          persist-credentials: true
      - name: Publish compiled browser bundle to web-wasm-dist
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p published/web-dist
          rsync -a --delete site-dist/ published/web-dist/
          cd published
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web-dist
          if git diff --cached --quiet; then
            echo "No changes in browser bundle"
          else
            git commit -m "Publish compiled browser bundle [skip ci]"
            git push origin HEAD:web-wasm-dist
          fi
