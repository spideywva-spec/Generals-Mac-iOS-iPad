name: Build browser Zero Hour (experimental)
on:
  workflow_dispatch:
  push:
    branches: [web-port-wasm]
    paths:
      - '.github/workflows/build-web-wasm.yml'
      - 'web-port/**'
permissions:
  contents: write
jobs:
  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout web port upstream
        uses: actions/checkout@v4
        with:
          repository: Lolendor/Generals-WebAssembly
          path: engine
          persist-credentials: false
      - name: Checkout Generals X launcher
        uses: actions/checkout@v4
        with:
          path: launcher-source
          persist-credentials: false
      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '4.0.15'
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake python3-brotli
      - name: Configure browser engine
        working-directory: engine
        run: |
          export EMSCRIPTEN_ROOT="$(dirname "$(command -v emcc)")"
          echo "EMSCRIPTEN_ROOT=$EMSCRIPTEN_ROOT"
          emcmake cmake --preset emscripten
      - name: Build browser engine
        working-directory: engine
        run: cmake --build build/emscripten --target GeneralsXZH.js --parallel 2
      - name: Stage browser shell (without copyrighted game data)
        working-directory: engine
        run: |
          mkdir -p web/dist/assets
          printf '[]\n' > web/dist/assets/builds.json
          bash scripts/web/make-dist.sh --skip-assets
      - name: Integrate original Generals X launcher and game route
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site-dist/game
          cp -R launcher-source/launcher_web/. site-dist/
          cp -R engine/web/dist/. site-dist/game/
          python3 - <<'PY'
          from pathlib import Path
          p = Path('site-dist/app.js')
          text = p.read_text()
          old = 'showToast("Демо: запрос запуска для " + activeCard.dataset.title);'
          assert text.count(old) == 1, 'Browser launcher Play hook not found'
          text = text.replace(old, 'window.GeneralsXWebGame.open();')
          # Preserve native launcher behavior; only the web Play button opens the embedded game.
          p.write_text(text)
          html = Path('site-dist/index.html')
          source = html.read_text()
          marker = '  <script src="./app.js"></script>'
          assert source.count(marker) == 1, 'Launcher app.js script not found'
          source = source.replace(marker, '''  <section id="gxWebGame" hidden aria-label="Zero Hour — веб-игра" style="position:fixed;inset:0;z-index:2147483000;background:#090e14;">
    <button id="gxWebGameBack" type="button" aria-label="Вернуться в лаунчер" style="position:absolute;top:max(12px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));z-index:3;padding:12px 18px;background:#123451;color:white;border:1px solid #629ad0;border-radius:9px;font-weight:700;cursor:pointer;">← В лаунчер</button>
    <iframe id="gxWebGameFrame" title="Generals Zero Hour — WebAssembly" allow="fullscreen; autoplay; gamepad" allowfullscreen style="width:100%;height:100%;border:0;display:block;" loading="lazy"></iframe>
  </section>
  <script>
    window.GeneralsXWebGame = (() => {
      const panel = document.getElementById('gxWebGame');
      const frame = document.getElementById('gxWebGameFrame');
      const back = document.getElementById('gxWebGameBack');
      let previousFocus = null;
      function close() {
        panel.hidden = true;
        panel.style.display = 'none';
        frame.src = 'about:blank';
        document.body.style.overflow = '';
        if (previousFocus && previousFocus.isConnected) previousFocus.focus();
      }
      function open() {
        previousFocus = document.activeElement;
        panel.hidden = false;
        panel.style.display = 'block';
        document.body.style.overflow = 'hidden';
        frame.src = './game/';
        back.focus();
      }
      back.addEventListener('click', close);
      document.addEventListener('keydown', event => {
        if (event.key === 'Escape' && !panel.hidden) close();
      });
      return { open, close };
    })();
  </script>
''' + marker)
          html.write_text(source)
          PY
          test -f site-dist/index.html
          # A newly claimed service worker does not retroactively isolate the page.
          # Reload on controllerchange so COOP/COEP are applied to the next navigation.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('site-dist/game/coi-serviceworker.js')
          source = p.read_text()
          marker = '    navigator.serviceWorker.register(swUrl)'
          assert source.count(marker) == 1, 'COI service worker registration not found'
          source = source.replace(marker, '''    let gxReloadingForIsolation = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!window.crossOriginIsolated && !gxReloadingForIsolation) {
        gxReloadingForIsolation = true;
        window.location.reload();
      }
    });

''' + marker)
          p.write_text(source)
          PY
          test -f site-dist/game/index.html
          test -f site-dist/game/GeneralsXZH.wasm
      - name: Upload web distribution
        uses: actions/upload-artifact@v4
        with:
          name: generals-x-browser-experimental
          path: site-dist/
          if-no-files-found: error
      - name: Checkout published web branch
        uses: actions/checkout@v4
        with:
          ref: web-wasm-dist
          path: published
          persist-credentials: true
      - name: Publish compiled browser bundle to web-wasm-dist
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p published/web-dist
          rsync -a --delete site-dist/ published/web-dist/
          cd published
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web-dist
          if git diff --cached --quiet; then
            echo "No changes in browser bundle"
          else
            git commit -m "Publish compiled browser bundle [skip ci]"
            git push origin HEAD:web-wasm-dist
          fi
