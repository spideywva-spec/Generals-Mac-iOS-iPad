# iOS-only clean build fix
# Trigger build on workflow updates to ios-clean
name: Build iOS Shell

on:
  workflow_dispatch:
    inputs:
      game_archive_url:
        description: "Direct download URL to Generals Deluxe ZIP (optional)"
        required: false
        type: string
        default: ""
  push:
    branches:
      - ios-clean
    paths:
      - 'GeneralsMD/**'
      - '!GeneralsMD/Code/Main/IOSProfileLauncher.mm'
      - '!GeneralsMD/Code/Main/IOSProfileLauncher.h'
      - 'Core/**'
      - 'Dependencies/Utility/**'
      - 'resources/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'vcpkg.json'
      - 'vcpkg-lock.json'
      - 'Patches/dxvk-ios.patch'
      - 'ios/**'
      - '!ios/version.env'
      - 'scripts/build/ios/package-shell.sh'
      - 'scripts/build/ios/fetch-moltenvk.sh'
      - 'scripts/build/ios/stage-fonts.sh'
      - '.github/workflows/build-ios-shell.yml'

permissions:
  contents: read

concurrency:
  group: ios-shell-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: GeneralsXZH iOS shell
    runs-on: macos-latest
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false

      - name: Checkout DXVK fork
        run: git submodule update --init --recursive --depth 1 references/fbraz3-dxvk

      # FIX FOR A13 / APPLE GPU FAMILY 6
      - name: Apply DXVK iOS Patch
        run: |
          if [ -f Patches/dxvk-ios.patch ]; then
            git -C references/fbraz3-dxvk apply ../../Patches/dxvk-ios.patch || true
          fi
          # Disable Vulkan 1.2/1.3 feature flags for Apple
          sed -i '' 's/m_hasVulkan12 = m_driverInfo.version >= VK_MAKE_VERSION(1, 2, 0);/m_hasVulkan12 = false;/g' references/fbraz3-dxvk/src/dxvk/dxvk_adapter.cpp || true
          sed -i '' 's/m_hasVulkan13 = m_driverInfo.version >= VK_MAKE_VERSION(1, 3, 0);/m_hasVulkan13 = false;/g' references/fbraz3-dxvk/src/dxvk/dxvk_adapter.cpp || true
          # Apple A12/A13 (Apple GPU Family 6) lack samplerMirrorClampToEdge.
          sed -i '' 's/enabled\.vk12\.samplerMirrorClampToEdge = VK_TRUE;/enabled.vk12.samplerMirrorClampToEdge = VK_FALSE;/' references/fbraz3-dxvk/src/d3d9/d3d9_device.cpp

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '18ff00a7d2697e23f22e2a2293c3fa6468a50c06'

      - name: Install build tools
        run: |
          brew update
          brew install cmake ninja meson pkg-config autoconf autoconf-archive automake libtool xcodegen glslang

      - name: Install Vulkan SDK
        shell: bash
        run: |
          set -euo pipefail
          VERSION="1.4.341.1"
          ZIP="/tmp/vulkansdk-macos-${VERSION}.zip"
          URL="https://sdk.lunarg.com/sdk/download/${VERSION}/mac/vulkansdk-macos-${VERSION}.zip"
          SHA256="632cbe96c8ed6ed00c6ce25e3a7738c466134f76586e1c51f1419410d7f9042e"
          EXTRACT="/tmp/vulkan-extract"
          ROOT="$HOME/VulkanSDK/${VERSION}"
          curl -fL --retry 3 --retry-delay 5 -o "${ZIP}" "${URL}"
          echo "${SHA256}  ${ZIP}" | shasum -a 256 -c -
          rm -rf "${EXTRACT}"
          mkdir -p "${EXTRACT}"
          unzip -q "${ZIP}" -d "${EXTRACT}"
          INSTALLER=$(find "${EXTRACT}" -path "*/Contents/MacOS/vulkansdk-macOS-${VERSION}" -type f | head -1)
          test -n "${INSTALLER}"
          chmod +x "${INSTALLER}"
          "${INSTALLER}" --root "${ROOT}" --accept-licenses --default-answer --confirm-command install
          if [[ -d "${ROOT}/macOS" ]]; then SDK="${ROOT}/macOS"; else SDK="${ROOT}"; fi
          test -f "${SDK}/lib/MoltenVK.xcframework/ios-arm64/libMoltenVK.a"
          test -d "${SDK}/include/vulkan"
          echo "VULKAN_SDK=${SDK}" >> "${GITHUB_ENV}"

      - name: Stage runtime resources
        run: |
          ./scripts/build/ios/fetch-moltenvk.sh
          ./scripts/build/ios/stage-fonts.sh

      - name: Configure iOS
        env:
          VULKAN_SDK: ${{ env.VULKAN_SDK }}
          VCPKG_ROOT: ${{ env.VCPKG_ROOT }}
          VCPKG_DEFAULT_TRIPLET: arm64-ios
          CC: clang
          CXX: clang++
          MVK_CONFIG_LOG_LEVEL: 1
        run: |
          mkdir -p logs
          cmake --preset ios-vulkan 2>&1 | tee logs/configure_ios.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Build iOS engine
        run: |
          mkdir -p logs
          NPROC=$(sysctl -n hw.ncpu)
          cmake --build build/ios-vulkan --target z_generals -j "${NPROC}" 2>&1 | tee logs/build_ios.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Verify binary
        run: |
          BIN="build/ios-vulkan/GeneralsMD/GeneralsXZH.app/GeneralsXZH"
          test -f "${BIN}"
          file "${BIN}" | grep -q "Mach-O"
          lipo -info "${BIN}" | grep -q arm64

      - name: Inject Fonts into App Bundle
        run: |
          APP="build/ios-vulkan/GeneralsMD/GeneralsXZH.app"
          FONTS_DIR="${HOME}/GeneralsX/ios-staging/fonts"
          
          if [ -d "$FONTS_DIR" ]; then
            echo "==> Injecting staged fonts into app bundle..."
            cp "$FONTS_DIR"/*.ttf "$APP/"
            mkdir -p "$APP/Data" "$APP/GameData"
            cp "$FONTS_DIR"/*.ttf "$APP/Data/"
            cp "$FONTS_DIR"/*.ttf "$APP/GameData/"
            echo "Fonts successfully injected everywhere!"
          else
            echo "ERROR: Fonts directory not found at $FONTS_DIR"
            exit 1
          fi

      - name: Package unsigned shell
        env:
          GX_BUNDLE_ID: com.dvorov.generalszh.launcher
        run: |
          chmod +x scripts/build/ios/package-shell.sh
          ./scripts/build/ios/package-shell.sh
          IPA="build/ios-package/GeneralsXZH-launcher-unsigned.ipa"
          test -f "${IPA}"
          unzip -l "${IPA}" | grep -q "Payload/GeneralsXZH.app/GeneralsXZH"
          if unzip -l "${IPA}" | grep -q "Payload/GeneralsXZH.app/Launcher/"; then
            echo "ERROR: legacy web launcher leaked into native shell"
            exit 1
          fi
          echo "IPA_SIZE=$(du -h "${IPA}" | cut -f1)" >> "${GITHUB_ENV}"

      # Optional retail game files: archive is supplied at dispatch time and is not committed.
      - name: Add Generals Deluxe game files
        if: ${{ inputs.game_archive_url != '' }}
        env:
          GAME_ARCHIVE_URL: ${{ inputs.game_archive_url }}
        shell: bash
        run: |
          set -euo pipefail
          IPA="build/ios-package/GeneralsXZH-launcher-unsigned.ipa"
          WORK="$RUNNER_TEMP/gamedata-import"
          ZIP="$RUNNER_TEMP/generals-deluxe.zip"
          mkdir -p "$WORK"
          curl -fL --retry 3 --retry-delay 5 "$GAME_ARCHIVE_URL" -o "$ZIP"
          python3 - "$ZIP" "$WORK" <<'PY'
          import pathlib, sys, zipfile
          archive = pathlib.Path(sys.argv[1])
          out = pathlib.Path(sys.argv[2]).resolve()
          with zipfile.ZipFile(archive) as z:
              for info in z.infolist():
                  name = info.filename.replace("\\\\", "/")
                  p = pathlib.PurePosixPath(name)
                  if p.is_absolute() or ".." in p.parts:
                      raise SystemExit(f"Unsafe ZIP path: {name}")
                  target = (out / pathlib.Path(*p.parts)).resolve()
                  if out not in target.parents and target != out:
                      raise SystemExit(f"Unsafe ZIP path: {name}")
                  if info.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with z.open(info) as src, target.open("wb") as dst:
                          dst.write(src.read())
          PY
          SOURCE="$WORK"
          if [[ -d "$WORK/Generals Deluxe" ]]; then SOURCE="$WORK/Generals Deluxe"; fi
          if [[ ! -f "$SOURCE/Generals.exe" && ! -d "$SOURCE/ZH_Generals" ]]; then
            echo "ERROR: ZIP does not contain the expected Generals Deluxe layout"
            find "$WORK" -maxdepth 3 -print | head -200
            exit 1
          fi
          UNPACK="$RUNNER_TEMP/ipa-unpack"
          mkdir -p "$UNPACK"
          unzip -q "$IPA" -d "$UNPACK"
          APP="$UNPACK/Payload/GeneralsXZH.app"
          test -d "$APP"
          mkdir -p "$APP/GameData"
          ditto "$SOURCE" "$APP/GameData"
          (cd "$UNPACK" && /usr/bin/zip -qry "$IPA" Payload)
          echo "Game files copied to app GameData."
          du -sh "$APP/GameData"

      - name: Upload shell
        uses: actions/upload-artifact@v7
        with:
          name: GeneralsXZH-launcher-unsigned
          path: build/ios-package/GeneralsXZH-launcher-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: GeneralsXZH-ios-build-logs
          path: logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Summary
        if: success()
        run: |
          echo "## iOS shell" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Engine: GeneralsXZH arm64" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Launcher: native UIKit" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Retail GameData: ${{ inputs.game_archive_url != '' && 'included from supplied ZIP' || 'not included' }}" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Mod profiles: not included" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Artifact size: ${IPA_SIZE}" >> "${GITHUB_STEP_SUMMARY}"
